<body>
Distributes <code>always</code> and <code>historically</code> over <code>and</code>, and <code>eventually</code> and <code>once</code> over <code>or</code>: <code>always (p and q)</code> becomes <code>always p and always q</code>. It also factors the operator out of a conjunction or disjunction whose operands all start with it.
