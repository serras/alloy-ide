<body>
Applies De Morgan's law to a negated <code>or</code> or <code>and</code>, or to a conjunction or disjunction of negations: <code>not (a or b)</code> becomes <code>not a and not b</code>, <code>not (a and b)</code> becomes <code>not a or not b</code>, and back. Operands are negated by their negated form, such as <code>x != y</code> for <code>x = y</code> or <code>no e</code> for <code>some e</code>.
